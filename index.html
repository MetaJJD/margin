<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Margin: a PDF reader and notebook for iPad with Apple Pencil notes.">
<meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d222a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Margin">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root { color-scheme: light; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { overflow: hidden; overscroll-behavior: none; }
body { margin: 0; font: 14px -apple-system, system-ui, "Segoe UI", sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.boot { position: fixed; inset: 0; display: grid; place-items: center; color: #5b6676; font-size: 15px; text-align: center; padding: 24px; }
</style>
<title>Margin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Klee+One&family=Noto+Serif+TC:wght@400;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style-01.css">
<link rel="stylesheet" href="style-02.css">
<link rel="stylesheet" href="style-03.css">
<link rel="stylesheet" href="style-04.css">
</head>
<body>
<div class="boot" id="boot">Opening Margin…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
/* Margin is split into small files so updates stay small. This joins them and starts the app. */
(async function () {
  const UI = ["ui-01.html", "ui-02.html"];
  const JS = ["app-01.js", "app-02.js", "app-03.js", "app-04.js", "app-05.js", "app-06.js", "app-07.js", "app-08.js", "app-09.js", "app-10.js", "app-11.js", "app-12.js", "app-13.js", "app-14.js", "app-15.js", "app-16.js", "app-17.js"];
  const get = (u) => fetch(u, { cache: "no-cache" }).then((r) => { if (!r.ok) throw new Error(u); return r.text(); });
  try {
    const [ui, js] = await Promise.all([Promise.all(UI.map(get)), Promise.all(JS.map(get))]);
    document.getElementById("boot").remove();
    document.body.insertAdjacentHTML("afterbegin", ui.join("\n"));
    const s = document.createElement("script");
    s.textContent = js.join("\n") + "\n//# sourceURL=margin-app.js";
    document.body.appendChild(s);
  } catch (e) {
    document.getElementById("boot").textContent = "Margin couldn't load. Check your internet connection, then close and reopen Margin.";
  }
})();
/* offline support + keep notes from being cleared */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(() => {}); }
</script>
</body>
</html>
